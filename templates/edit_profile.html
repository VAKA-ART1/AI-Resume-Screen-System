<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
            font-family:Arial, Helvetica, sans-serif;
        }

        .profile-card{
            max-width:700px;
            margin:50px auto;
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 8px 25px rgba(0,0,0,.12);
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid #0d6efd;
            object-fit:cover;
        }

        h2{
            font-weight:bold;
        }

        label{
            font-weight:600;
            margin-bottom:5px;
        }

        .form-control{
            border-radius:10px;
            padding:10px;
        }

        .btn{
            border-radius:10px;
            padding:10px;
            font-weight:bold;
        }

        .section-title{
            color:#0d6efd;
            font-weight:bold;
            margin-top:20px;
            margin-bottom:15px;
        }
    </style>

</head>

<body>

<div class="container">

<div class="profile-card">

<div class="text-center">

<img src="{{ user.picture }}" class="profile-img">

<h2 class="mt-3">{{ user.fullname }}</h2>

<p class="text-muted">{{ user.email }}</p>

</div>

<hr>

<form method="POST" enctype="multipart/form-data">

<h5 class="section-title">
<i class="fa-solid fa-user"></i>
Personal Information
</h5>

<div class="mb-3">
<label>Full Name</label>
<input
type="text"
name="fullname"
class="form-control"
value="{{ user.fullname }}">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email"
       name="email"
       class="form-control"
       value="{{ user.email }}"
       required>
</div>

<div class="mb-3">
<label>Phone Number</label>
<input
type="text"
name="phone"
class="form-control"
value="{{ user.phone or '' }}">
</div>

<div class="mb-3">
<label>College</label>
<input
type="text"
name="college"
class="form-control"
value="{{ user.college or '' }}">
</div>

<div class="mb-3">
<label>Degree</label>
<input
type="text"
name="degree"
class="form-control"
value="{{ user.degree or '' }}">
</div>

<div class="mb-3">
<label>CGPA</label>
<input
type="text"
name="cgpa"
class="form-control"
value="{{ user.cgpa or '' }}">
</div>

<div class="mb-3">
<label>Skills</label>
<input
type="text"
name="skills"
class="form-control"
placeholder="Python, Java, SQL, Flask"
value="{{ user.skills or '' }}">
</div>

<div class="mb-3">
<label>Experience</label>
<input
type="text"
name="experience"
class="form-control"
placeholder="Fresher"
value="{{ user.experience or '' }}">
</div>

<div class="mb-4">
<label>Upload Resume (PDF / DOC / DOCX)</label>

<div class="mb-4">

    <label>Upload Resume (PDF)</label>

    <input
        type="file"
        id="resume"
        name="resume"
        class="form-control"
        accept=".pdf">

    <div id="ats-loading"
         class="text-primary mt-3"
         style="display:none;">

        <i class="fa-solid fa-spinner fa-spin"></i>
        Analyzing Resume...

    </div>

    <div id="ats-result"
         class="mt-3"
         style="display:none;">

        <div class="alert alert-success">

            <h4>
                <i class="fa-solid fa-chart-line"></i>
                ATS Score:
                <strong id="ats-score">0</strong>%
            </h4>

            <p class="mb-1">
                Detected Skills:
            </p>

            <div id="detected-skills"></div>

        </div>

    </div>

    {% if user.resume %}

    <div class="mt-2">

        <span class="text-success">
            <i class="fa-solid fa-file"></i>
            Current Resume:
        </span>

        <a
            href="/uploads/{{ user.resume }}"
            target="_blank">

            {{ user.resume }}

        </a>

    </div>

    {% endif %}

</div>

{% if user.resume %}
<div class="mt-2">
<span class="text-success">
<i class="fa-solid fa-file"></i>
Current Resume:
</span>

<a href="/uploads/{{ user.resume }}" target="_blank">
{{ user.resume }}
</a>
</div>
{% endif %}

</div>

<div class="d-flex gap-3">

<button
type="submit"
class="btn btn-success flex-fill">

<i class="fa-solid fa-floppy-disk"></i>

Save Profile

</button>

<a
href="/candidate"
class="btn btn-secondary flex-fill">

<i class="fa-solid fa-arrow-left"></i>

Cancel

</a>

</div>

</form>

</div>

</div>
<script>

document.getElementById("resume").addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    const loading = document.getElementById("ats-loading");
    const result = document.getElementById("ats-result");
    const score = document.getElementById("ats-score");
    const skillsBox = document.getElementById("detected-skills");

    loading.style.display = "block";
    result.style.display = "none";

    const formData = new FormData();

    formData.append("resume", file);

    fetch("/calculate-ats", {
        method: "POST",
        body: formData
    })

    .then(response => response.json())

    .then(data => {

        loading.style.display = "none";

        if (data.success) {

            score.innerText = data.score;

            skillsBox.innerHTML = "";

            data.skills.forEach(skill => {

                const badge = document.createElement("span");

                badge.className = "badge bg-primary me-1";

                badge.innerText = skill;

                skillsBox.appendChild(badge);

            });

            result.style.display = "block";

        } else {

            alert(data.message);

        }

    })

    .catch(error => {

        loading.style.display = "none";

        console.error(error);

        alert("Error while analyzing resume.");

    });

});

</script>

</body>

</html>

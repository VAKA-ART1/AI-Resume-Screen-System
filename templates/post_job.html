<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Job</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        body {
            background: #f4f7fc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            background: #1f2937;
        }

        .job-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .btn {
            border-radius: 10px;
            padding: 12px;
        }

        .page-title {
            font-weight: 700;
        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">
            AI Resume Screening & ATS
        </span>

        <div>

            <a
                href="/recruiter/dashboard"
                class="btn btn-light">

                <i class="fa-solid fa-arrow-left"></i>
                Dashboard

            </a>

            <a
                href="/logout"
                class="btn btn-danger ms-2">

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- MAIN CONTENT -->

<div class="container mt-5 mb-5">

    <div class="job-card">

        <h2 class="page-title mb-2">

            <i class="fa-solid fa-briefcase text-primary"></i>

            Post a New Job

        </h2>

        <p class="text-muted mb-4">

            Create a job vacancy and attract suitable candidates.

        </p>


        <!-- FLASH MESSAGE -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-info">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- JOB FORM -->

        <form
            method="POST"
            action="/recruiter/post-job">


            <div class="row">


                <!-- JOB TITLE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Job Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Example: Software Engineer"
                        required>

                </div>


                <!-- COMPANY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Company
                    </label>

                    <input
                        type="text"
                        name="company"
                        class="form-control"
                        placeholder="Example: Google"
                        required>

                </div>


                <!-- LOCATION -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        placeholder="Example: Hyderabad"
                        required>

                </div>


                <!-- SALARY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Salary
                    </label>

                    <input
                        type="text"
                        name="salary"
                        class="form-control"
                        placeholder="Example: 8-12 LPA">

                </div>


                <!-- EXPERIENCE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Experience
                    </label>

                    <input
                        type="text"
                        name="experience"
                        class="form-control"
                        placeholder="Example: 0-2 Years">

                </div>


                <!-- JOB TYPE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Job Type
                    </label>

                    <select
                        name="job_type"
                        class="form-select">

                        <option value="Full Time">
                            Full Time
                        </option>

                        <option value="Part Time">
                            Part Time
                        </option>

                        <option value="Internship">
                            Internship
                        </option>

                        <option value="Remote">
                            Remote
                        </option>

                    </select>

                </div>


                <!-- SKILLS -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Required Skills
                    </label>

                    <input
                        type="text"
                        name="skills"
                        class="form-control"
                        placeholder="Python, SQL, Flask, Java, Machine Learning"
                        required>

                    <small class="text-muted">

                        Separate skills using commas.

                    </small>

                </div>


                <!-- DESCRIPTION -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Job Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Describe the job role..."></textarea>

                </div>


                <!-- RESPONSIBILITIES -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Responsibilities
                    </label>

                    <textarea
                        name="responsibilities"
                        class="form-control"
                        rows="5"
                        placeholder="Enter the responsibilities of the candidate..."></textarea>

                </div>


                <!-- QUALIFICATIONS -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Qualifications
                    </label>

                    <textarea
                        name="qualifications"
                        class="form-control"
                        rows="4"
                        placeholder="Example: B.Tech CSE, Python knowledge, SQL..."></textarea>

                </div>


                <!-- BENEFITS -->

                <div class="col-12 mb-4">

                    <label class="form-label">
                        Benefits
                    </label>

                    <textarea
                        name="benefits"
                        class="form-control"
                        rows="4"
                        placeholder="Example: Health Insurance, Work From Home, Paid Leave..."></textarea>

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="d-flex gap-3">

                <button
                    type="submit"
                    class="btn btn-success flex-grow-1">

                    <i class="fa-solid fa-paper-plane"></i>

                    Post Job

                </button>

                <a
                    href="/recruiter/dashboard"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>


</body>

</html>
